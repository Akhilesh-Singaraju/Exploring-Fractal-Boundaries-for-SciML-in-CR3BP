[package]
name = "cr3bp_basins"
version = "0.1.0"
edition = "2024"
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
]

[dependencies]
rayon = "1.10"
ivp = "0.6"
indicatif = "0.18.6"
differential-equations = "0.6.1"
cmake = "0.1"
bindgen = "0.72"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
